server.port=8081

# Database connection (Azure Database for MySQL or compatible).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:order_service}?useSSL=true&requireSSL=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}

# Inventory service base URL (deployed inventory service endpoint).
client.inventory.url=${CLIENT_INVENTORY_URL:http://localhost:8082}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# docs
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

